name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      # One command, not a sync followed by a run: .python-version pins 3.12 for local work,
      # so a separate `uv run` would go looking for that interpreter and find an environment
      # without the dev dependencies in it.
      - name: Test (uv builds the extension)
        run: uv run --extra dev --python ${{ matrix.python }} pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # uvx rather than `uv run`: linting has no business building the extension first.
      - run: uvx ruff check src tests tools
      - run: uvx ruff format --check src tests tools
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --release --all-targets -- -D warnings

  corpus:
    # The golden vectors are generated, and the generator is deterministic. Regenerating
    # them must therefore change nothing — if it does, the reference moved, and that is a
    # fact worth seeing in a diff rather than discovering as a mysterious test failure.
    name: the corpus still reproduces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm --prefix tools ci
      - run: node tools/gen_vectors.mjs /tmp/regenerated.jsonl.gz
      - name: Nothing changed
        # The *content* is compared, not the gzip bytes: those depend on the zlib the
        # runner's node was built with, and would fail this job for a reason that has
        # nothing to do with the vectors.
        run: |
          gzip -dc tests/data/vectors.jsonl.gz | sha256sum | cut -d" " -f1 > /tmp/committed.sha
          gzip -dc /tmp/regenerated.jsonl.gz  | sha256sum | cut -d" " -f1 > /tmp/fresh.sha
          diff /tmp/committed.sha /tmp/fresh.sha

  deployment-image:
    # The package is installed into python:3.12-slim-bullseye, whose glibc is older than any
    # runner's. An extension built here loads there only if it was built there — see
    # tools/check_linux.sh.
    name: builds and passes in the deployment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/check_linux.sh
