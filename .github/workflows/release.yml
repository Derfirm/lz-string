name: release

# Wheels on a tag, and the upload behind a manual approval.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The upload step needs one secret, PYPI_API_TOKEN, on the `pypi` environment. Trusted
# publishing (OIDC, no token at all) is the better answer once the project exists on PyPI:
# drop the token, add `permissions: id-token: write`, and delete the `password:` line.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  version:
    # A tag and a pyproject that disagree produce wheels named after one and a release named
    # after the other, or an upload PyPI rejects because that version is already there. The
    # version lives in pyproject.toml; the tag has to say the same thing.
    name: the tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: v$TAG == version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag says $tag, pyproject says $declared"
          test "$tag" = "$declared"

  wheels:
    name: wheels ${{ matrix.platform.target }} on ${{ matrix.platform.runner }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-latest, target: aarch64 }
          # Cross-compiled on the arm runner: GitHub has retired macos-13, and a job asking
          # for it sits in the queue forever rather than failing — which would hang a release
          # rather than break it, since publish waits for every wheel.
          - { runner: macos-latest, target: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          # manylinux2014 is glibc 2.17, older than anything this is likely to be installed
          # into. A wheel built against a newer glibc compiles cleanly and then fails at
          # import with "GLIBC_2.xx not found" — see SPEC.md and tools/check_linux.sh.
          manylinux: "2014"
      - name: The wheel imports and round-trips
        # Only where the runner can execute what it just built; the cross-compiled ones are
        # exercised by the deployment-image job in ci.yml instead.
        if: matrix.platform.target == 'x86_64' && matrix.platform.runner == 'ubuntu-latest'
        run: |
          uv venv --python 3.12
          uv pip install --no-index --find-links dist lzstring-codec
          .venv/bin/python -c "import lz_string as lz; assert lz.decompress_from_base64(lz.compress_to_base64('ok')) == 'ok'"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # An environment so the upload waits for a human, and so the credential lives in one
    # place.
    environment: pypi
    permissions:
      # For trusted publishing, which is the better end state: configure this repository and
      # workflow as a publisher on PyPI, delete the `password:` line below, and there is no
      # token to store or rotate at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # `maturin upload` still works but is deprecated and slated for removal; this is the
      # action PyPI itself documents. Pinned to a commit rather than to `release/v1`, which
      # is a branch: this step holds the credential that can publish under our name, and a
      # moving reference means whatever lands there tomorrow holds it too. The SHA is
      # v1.14.2; dependabot opens a pull request when there is a newer one.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Kept for recovering from a partial upload — but it also means an upload that
          # uploaded nothing reports success, so the step below checks the result rather
          # than the exit code.
          skip-existing: true
      - name: The version is really on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            files=$(curl -sf "https://pypi.org/pypi/lzstring-codec/$version/json" | jq '.urls | length') && break
            echo "not there yet (attempt $attempt)"; sleep 10
          done
          echo "$version has ${files:-0} files on PyPI"
          test "${files:-0}" -ge 5
